name: Deploy

# Chaque push sur main : contrôles, tests, build, PDF du CV, puis mise en ligne sur GitHub Pages.
# Un échec à n'importe quelle étape de `build` bloque le déploiement.
# Prérequis (réglages du dépôt) : Pages > Source > GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas interrompu par le suivant.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 : requis par Astro 7 et par les scripts qui chargent des fichiers .ts tels quels
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:cv
      - run: node scripts/check-dist.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
